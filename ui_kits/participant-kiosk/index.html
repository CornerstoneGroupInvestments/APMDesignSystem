<!-- @dsCard group="Participant Kiosk" viewport="1440x820" name="Participant Kiosk" subtitle="Lock screen → sign-in → bookmark launcher → session end" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>APM Participant Kiosk</title>
<link rel="stylesheet" href="../../styles.css" />
<style>
  html, body { height: 100%; margin: 0; background: var(--apm-navy-900); }
  /* Fixed kiosk canvas, scaled to fit any viewport */
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #canvas { position: relative; width: 1440px; height: 900px; background: #fff; overflow: hidden;
            border-radius: 6px; box-shadow: 0 30px 80px rgba(0,0,0,.5); transform-origin: center; }
</style>
</head>
<body>
<div id="stage"><div id="canvas"><div id="root"></div></div></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="bookmarks.js"></script>
<script type="text/babel" src="Icons.jsx"></script>
<script type="text/babel" src="KioskScreens.jsx"></script>
<script type="text/babel" src="KioskHome.jsx"></script>
<script type="text/babel">
const DEVICE = { user: 'kiosk-CU9G7H2@apm.net.au', pass: 'Brave-Tide-7194', asset: 'KI-APM-042' };
const { LockScreen, SignIn } = window.KioskScreens;
const KioskHome = window.KioskHome, SessionEnded = window.SessionEnded;

function App() {
  const [screen, setScreen] = React.useState('lock'); // lock | signin | home | ended
  const [secs, setSecs] = React.useState(600);

  React.useEffect(() => {
    if (screen !== 'home') return;
    setSecs(600);
    const t = setInterval(() => setSecs((s) => {
      if (s <= 1) { clearInterval(t); setScreen('ended'); return 0; }
      return s - 1;
    }), 1000);
    return () => clearInterval(t);
  }, [screen]);

  return (
    <React.Fragment>
      {screen === 'lock' && <LockScreen device={DEVICE} onSignIn={() => setScreen('signin')} />}
      {screen === 'signin' && <SignIn device={DEVICE} onDone={() => setScreen('home')} />}
      {screen === 'home' && <KioskHome device={DEVICE} secondsLeft={secs} onEnd={() => setScreen('ended')} />}
      {screen === 'ended' && <SessionEnded onReset={() => setScreen('lock')} />}
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

// Scale canvas to fit viewport
function fit() {
  const c = document.getElementById('canvas');
  const s = Math.min(window.innerWidth / 1440, window.innerHeight / 900);
  c.style.transform = `scale(${s})`;
}
window.addEventListener('resize', fit); fit();
</script>
</body>
</html>
