<!-- @dsCard group="Colors" viewport="700x150" name="Ribbon accents" subtitle="Decorative gradient family — indigo · purple · magenta" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
 body{margin:0;padding:20px;background:var(--surface-card);font-family:var(--font-ui)}
 .row{display:flex;gap:10px}
 .sw{flex:1;height:88px;border-radius:var(--radius-md);display:flex;align-items:flex-end;padding:8px;box-sizing:border-box;font-size:11px;font-weight:700;color:#fff}
 .sw small{display:block;font-weight:500;opacity:.8;font-size:10px}
 .grad{flex:1.6;height:88px;border-radius:var(--radius-md);background:var(--gradient-ribbon);display:flex;align-items:flex-end;padding:8px;box-sizing:border-box;font-size:11px;font-weight:700;color:#fff}
</style></head>
<body>
<div class="row">
  <div class="sw" style="background:var(--apm-indigo)">Indigo<small>#2E3192</small></div>
  <div class="sw" style="background:var(--apm-purple)">Purple<small>#5C2D91</small></div>
  <div class="sw" style="background:var(--apm-magenta)">Magenta<small>#E51C84</small></div>
  <div class="grad">--gradient-ribbon</div>
</div>
</body></html>
