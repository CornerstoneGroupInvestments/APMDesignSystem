<!-- @dsCard group="Brand" viewport="700x180" name="Gradient ribbons" subtitle="Angular brand motif — used as page accents" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style> body{margin:0;font-family:var(--font-ui);background:var(--surface-card)}
 .stage{position:relative;height:180px;overflow:hidden;background:var(--surface-card)}
 .stage img{position:absolute;width:62%;height:auto;opacity:1}
 .magenta{top:-20px;right:-40px}
 .navy{bottom:-30px;left:-30px;width:48%}
 .label{position:absolute;bottom:14px;right:18px;font-size:11px;font-weight:700;color:var(--text-muted);letter-spacing:.04em}
</style></head>
<body>
<div class="stage">
  <img class="magenta" src="../assets/ribbon-magenta.png" alt="">
  <img class="navy" src="../assets/ribbon-purple.png" alt="">
  <span class="label">indigo → purple → magenta</span>
</div>
</body></html>
