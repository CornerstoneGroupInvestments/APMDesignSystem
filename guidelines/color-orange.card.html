<!-- @dsCard group="Colors" viewport="700x150" name="Brand — Orange" subtitle="Core APM orange + ramp" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
 body{margin:0;padding:20px;background:var(--surface-card);font-family:var(--font-ui)}
 .row{display:flex;gap:10px}
 .sw{flex:1;height:88px;border-radius:var(--radius-md);display:flex;align-items:flex-end;padding:8px;box-sizing:border-box;font-size:11px;font-weight:700}
 .sw small{display:block;font-weight:500;opacity:.7;font-size:10px}
</style></head>
<body>
<div class="row">
  <div class="sw" style="background:var(--apm-orange-100);color:var(--apm-orange-900)">100</div>
  <div class="sw" style="background:var(--apm-orange-300);color:var(--apm-orange-900)">300</div>
  <div class="sw" style="background:var(--apm-orange-500);color:var(--apm-navy-700)">500<small>#F89728 core</small></div>
  <div class="sw" style="background:var(--apm-orange-600);color:#fff">600<small>hover</small></div>
  <div class="sw" style="background:var(--apm-orange-800);color:#fff">800</div>
</div>
</body></html>
