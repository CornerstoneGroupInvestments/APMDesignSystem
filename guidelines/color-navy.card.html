<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
 body{margin:0;padding:20px;background:var(--surface-card);font-family:var(--font-ui)}
 .row{display:flex;gap:10px}
 .sw{flex:1;height:88px;border-radius:var(--radius-md);display:flex;align-items:flex-end;padding:8px;box-sizing:border-box;font-size:11px;font-weight:700}
 .sw small{display:block;font-weight:500;opacity:.7;font-size:10px}
</style></head>
<body>
<div class="row">
  <div class="sw" style="background:var(--apm-navy-50);color:var(--apm-navy-700)">50</div>
  <div class="sw" style="background:var(--apm-navy-100);color:var(--apm-navy-700)">100</div>
  <div class="sw" style="background:var(--apm-navy-400);color:#fff">400</div>
  <div class="sw" style="background:var(--apm-navy-600);color:#fff">600<small>#1F2D58 core</small></div>
  <div class="sw" style="background:var(--apm-navy-900);color:#fff">900<small>deep</small></div>
</div>
</body></html>
