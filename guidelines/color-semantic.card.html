<!-- @dsCard group="Colors" viewport="700x150" name="Semantic status" subtitle="Success · warning · danger · info" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
 body{margin:0;padding:20px;background:var(--surface-card);font-family:var(--font-ui)}
 .row{display:flex;gap:12px}
 .cell{flex:1;display:flex;flex-direction:column;gap:6px}
 .sw{height:54px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
 .bg{height:24px;border-radius:var(--radius-sm);font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:600}
</style></head>
<body>
<div class="row">
  <div class="cell"><div class="sw" style="background:var(--status-success)">Success</div><div class="bg" style="background:var(--status-success-bg);color:var(--status-success)">bg</div></div>
  <div class="cell"><div class="sw" style="background:var(--status-warning)">Warning</div><div class="bg" style="background:var(--status-warning-bg);color:#9A6206">bg</div></div>
  <div class="cell"><div class="sw" style="background:var(--status-danger)">Danger</div><div class="bg" style="background:var(--status-danger-bg);color:var(--status-danger)">bg</div></div>
  <div class="cell"><div class="sw" style="background:var(--status-info)">Info</div><div class="bg" style="background:var(--status-info-bg);color:var(--status-info)">bg</div></div>
</div>
</body></html>
