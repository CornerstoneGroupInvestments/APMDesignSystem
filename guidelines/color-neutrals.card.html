<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals" subtitle="Greys for text, surfaces, borders" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
 body{margin:0;padding:20px;background:var(--surface-card);font-family:var(--font-ui)}
 .row{display:flex;gap:6px}
 .sw{flex:1;height:88px;border-radius:var(--radius-sm);display:flex;align-items:flex-end;padding:6px;box-sizing:border-box;font-size:10px;font-weight:700;border:1px solid var(--border-subtle)}
</style></head>
<body>
<div class="row">
  <div class="sw" style="background:var(--neutral-0);color:var(--neutral-700)">0</div>
  <div class="sw" style="background:var(--neutral-50);color:var(--neutral-700)">50</div>
  <div class="sw" style="background:var(--neutral-100);color:var(--neutral-700)">100</div>
  <div class="sw" style="background:var(--neutral-200);color:var(--neutral-700)">200</div>
  <div class="sw" style="background:var(--neutral-300);color:var(--neutral-700)">300</div>
  <div class="sw" style="background:var(--neutral-400);color:#fff">400</div>
  <div class="sw" style="background:var(--neutral-500);color:#fff">500</div>
  <div class="sw" style="background:var(--neutral-700);color:#fff">700</div>
  <div class="sw" style="background:var(--neutral-900);color:#fff">900</div>
</div>
</body></html>
